<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us - Old Age Home</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: url('contactpic.jpg') no-repeat center center fixed;
      background-size: cover;
    }
    .container {
      width: 80%;
      max-width: 600px;
      padding: 20px;
      background-color: rgba(255, 255, 255, 0.9); 
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
    }
    h1 {
      text-align: center;
      color: #333;
    }
    .contact-info {
      margin: 20px 0;
      text-align: center;
      color: #555;
    }
    .contact-info p {
      margin: 8px 0;
    }
    .form-group {
      margin-bottom: 15px;
    }
    label {
      display: block;
      font-weight: bold;
      margin-bottom: 5px;
    }
    input[type="text"],
    input[type="email"],
    textarea {
      width: 100%;
      padding: 8px;
      border: 1px solid #ddd;
      border-radius: 4px;
    }
    textarea {
      resize: vertical;
    }
    .submit-btn {
      display: block;
      width: 100%;
      padding: 10px;
      background-color: lightblue;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 16px;
    }
    .submit-btn:hover {
      background-color: palegoldenrod;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>Contact Us</h1>
  <div class="contact-info">
    <p><strong>Address:</strong> Avantika Enclave, Ameenpur, Hyderabad</p>
    <p><strong>Phone:</strong> +91 7989026236,9392630070</p>
    <p><strong>Email:</strong> happyhomes1607@gmail.com</p>
  </div>
  
  <!-- Contact Form -->
  <form id="contact-form">
    <div class="form-group">
      <label for="name">Your Name</label>
      <input type="text" id="name" name="name" required>
    </div>
    <div class="form-group">
      <label for="email">Your Email</label>
      <input type="email" id="email" name="email" required>
    </div>
    <div class="form-group">
      <label for="message">Your Message</label>
      <textarea id="message" name="message" rows="5" required></textarea>
    </div>
    <button type="submit" class="submit-btn">Send Message</button>
  </form>
</div>

<script>
  document.getElementById('contact-form').addEventListener('submit', async (event) => {
    event.preventDefault();
    
    const formData = {
      name: document.getElementById('name').value,
      email: document.getElementById('email').value,
      message: document.getElementById('message').value
    };

    try {
      const response = await fetch('http://localhost:3000/contact', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(formData),
      });

      const result = await response.json();
      console.log(result);
      alert(result.message);
    } catch (error) {
      alert('Error submitting the form. Please try again.');
    }
  });
</script>

</body>
</html>
