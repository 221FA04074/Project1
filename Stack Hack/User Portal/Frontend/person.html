<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Personal Details Form</title>
  <style>
    /* Styles for form layout and input fields */
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
    body { background-color: #f0f4f8; }
    .form-container { width: 60%; margin: 20px auto; padding: 20px; border-radius: 8px; background-color: #ffffff; box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2); }
    .form-container h2 { text-align: center; margin-bottom: 20px; color: #333; }
    .form-section { margin-bottom: 20px; }
    .form-section h3 { font-size: 1.3rem; color: #1a73e8; margin-bottom: 10px; border-bottom: 2px solid #a1c4fe; padding-bottom: 5px; }
    .form-group { display: flex; flex-wrap: wrap; gap: 20px; margin-bottom: 15px; }
    .form-group label { flex: 1 1 200px; font-size: 1rem; color: #333; }
    .form-group input[type="text"], .form-group input[type="number"], .form-group input[type="email"], .form-group input[type="file"], .form-group select { flex: 2 1 300px; padding: 8px; border: 1px solid #ddd; border-radius: 5px; transition: border-color 0.3s; }
    .form-group input:focus, .form-group select:focus { border-color: #1a73e8; outline: none; }
    .hidden { display: none; }
    .submit-btn { display: block; width: 100%; padding: 10px; border: none; border-radius: 5px; background-color: #1a73e8; color: white; font-size: 1rem; cursor: pointer; transition: background-color 0.3s, transform 0.3s; }
    .submit-btn:hover { background-color: #155ab6; transform: scale(1.05); }
  </style>
</head>
<body>
  <div class="form-container">
    <h2>Personal Details Form</h2>
    <div class="form-section">
      <h3>Personal Details</h3>
      <div class="form-group">
        <label for="personal-name">Name:</label>
        <input type="text" id="personal-name" required>
      </div>
      <div class="form-group">
        <label for="personal-surname">Surname:</label>
        <input type="text" id="personal-surname" required>
      </div>
      <div class="form-group">
        <label for="personal-age">Age:</label>
        <input type="number" id="personal-age" required>
      </div>
      <div class="form-group">
        <label for="personal-phone">Phone Number:</label>
        <input type="text" id="personal-phone" required>
      </div>
    </div>

    <!-- Proofs Section -->
    <div class="form-section">
      <h3>Proofs</h3>
      <div class="form-group">
        <label for="proof-type">Select Proof:</label>
        <select id="proof-type" onchange="toggleProofFields()" required>
          <option value="">Select</option>
          <option value="aadhar">Aadhar</option>
          <option value="pan">PAN</option>
        </select>
      </div>
      <!-- Aadhar Section -->
      <div id="aadhar-fields" class="hidden">
        <div class="form-group">
          <label for="aadhar-number">Aadhar Number:</label>
          <input type="text" id="aadhar-number" pattern="\d{12}" title="Aadhar number must be exactly 12 digits" required>
        </div>
        <div class="form-group">
          <label for="aadhar-file">Upload Aadhar File:</label>
          <input type="file" id="aadhar-file" accept=".pdf,.jpg,.jpeg,.png" required>
        </div>
      </div>
      <!-- PAN Section -->
      <div id="pan-fields" class="hidden">
        <div class="form-group">
          <label for="pan-number">PAN Number:</label>
          <input type="text" id="pan-number" pattern="[A-Z0-9]{10}" title="PAN number must be exactly 10 characters" required>
        </div>
        <div class="form-group">
          <label for="pan-file">Upload PAN File:</label>
          <input type="file" id="pan-file" accept=".pdf,.jpg,.jpeg,.png" required>
        </div>
      </div>
    </div>

    <!-- Joined By Section -->
    <div class="form-section">
      <h3>Joined By</h3>
      <div class="form-group">
        <label for="joined-name">Name:</label>
        <input type="text" id="joined-name" required>
      </div>
      <div class="form-group">
        <label for="joined-surname">Surname:</label>
        <input type="text" id="joined-surname" required>
      </div>
      <div class="form-group">
        <label for="relation">Relation:</label>
        <input type="text" id="relation" required>
      </div>
      <div class="form-group">
        <label for="joined-email">Email:</label>
        <input type="email" id="joined-email" required>
      </div>
      <div class="form-group">
        <label for="joined-phone">Phone Number:</label>
        <input type="text" id="joined-phone" required>
      </div>
    </div>

    <!-- Submit Button -->
    <button type="submit" class="submit-btn" onclick="submitForm()">Submit</button>
  </div>

  <script>
    function toggleProofFields() {
      const proofType = document.getElementById('proof-type').value;
      document.getElementById('aadhar-fields').classList.add('hidden');
      document.getElementById('pan-fields').classList.add('hidden');
      
      if (proofType === 'aadhar') {
        document.getElementById('aadhar-fields').classList.remove('hidden');
      } else if (proofType === 'pan') {
        document.getElementById('pan-fields').classList.remove('hidden');
      }
    }

    function submitForm() {
      alert("Form submitted successfully!");
      window.location.href = "qr-code-page.html"; // Redirect to the QR code page
    }
  </script>
</body>
</html>
