<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Old Age Home</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            font-family: Arial, sans-serif;
            color: brown; 
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .video-background {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -1;
            filter: blur(1px); 
        }

        .content {
            text-align: center;
            max-width: 600px;
            margin-top: 20px;
            z-index: 1;
            color: brown;
        }

        .welcome-text {
            font-size: 3em;
            margin: 0;
            font-weight: bold; 
            text-transform: uppercase; 
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
        }

        .letter {
            opacity: 0; 
            animation: fadeIn 1s forwards;
        }

        @keyframes fadeIn {
            to {
                opacity: 1; 
            }
        }

        .top-right-buttons {
            position: absolute;
            top: 20px;
            right: 20px;
            display: flex;
            gap: 20px;
        }

        .top-right-buttons a {
            padding: 10px 20px;
            font-size: 1.2em;
            color: white; 
            text-decoration: none;
            background: rgb(229, 211, 11); 
            border-radius: 8px;
            transition: background 0.3s ease;
        }

        .top-right-buttons a:hover {
            background: brown; 
            color: white;
        }

        @media (max-width: 768px) {
            .welcome-text {
                font-size: 2em;
            }
            .top-right-buttons a {
                font-size: 1em;
                padding: 8px 16px;
            }
        }
    </style>
</head>
<body>
    <video autoplay muted loop class="video-background">
        <source src="backgroundvideo.mp4" type="video/mp4">
    </video>

    <div class="content">
        <div id="welcome-text" class="welcome-text"></div>
    </div>

    <div class="top-right-buttons">
        <a href="register.html" aria-label="Register for our services">Register</a>
        <a href="login.html" aria-label="Login to your account">Login</a>
    </div>

    <script>
        const text = "HOME FOR SR CITIZENS"; 
        const welcomeTextElement = document.getElementById('welcome-text');

        function displayLetters() {
            text.split('').forEach((letter, index) => {
                const span = document.createElement('span');
                span.classList.add('letter');
                span.textContent = letter === ' ' ? '\u00A0' : letter; 
                span.style.animationDelay = `${index * 0.1}s`;
                welcomeTextElement.appendChild(span);
            });
        }

        displayLetters();
    </script>
</body>
</html>
